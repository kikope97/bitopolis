<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1c2c" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="referrer" content="no-referrer" />
    <title>Bitópolis</title>
  </head>
  <body>
    <div id="toasts" aria-live="polite"></div>
    <p id="sr-live" class="visually-hidden" aria-live="polite"></p>

    <main id="start" class="start" hidden>
      <div class="start-top">
        <button id="configure" class="btn small">⚙ Configurar</button>
      </div>
      <canvas id="skyline" class="skyline" width="320" height="64" aria-hidden="true"></canvas>
      <h1 class="logo">Bitópolis</h1>
      <p class="tagline">Eres el alcalde. Los vecinos deciden por su cuenta.</p>
      <div id="start-body"></div>
      <div class="row start-actions">
        <button id="play" class="btn primary big">Jugar</button>
      </div>
      <details class="link-box">
        <summary><canvas class="px-icon" data-icon="key" aria-hidden="true"></canvas> Tu enlace de partida: guárdalo y no lo publiques</summary>
        <p id="link-text" class="mono small"></p>
        <p id="link-note" class="muted small" hidden>Es el enlace oficial para compartir: lleva a esta misma partida aunque no coincida con la dirección del navegador.</p>
        <button id="copy-link" class="btn wide">Copiar enlace</button>
      </details>
    </main>

    <div id="game" class="game" hidden>
      <header class="hud" role="status" aria-label="Estado del pueblo">
        <span id="hud-date"></span>
        <button id="hud-money" class="hud-btn" aria-label="Caja del ayuntamiento: ver cuentas"></button>
        <span id="hud-pop"></span>
        <span id="hud-happy" aria-label="Felicidad media"></span>
        <button id="hud-poll" class="hud-btn" hidden></button>
        <button id="ai-chip" class="ai-chip" hidden>IA ●</button>
      </header>
      <div id="demand" class="demand" aria-label="Demanda">
        <div class="d-row" data-d="R"><b>R</b><span class="bar"><span class="bar-fill bar-r"></span></span><span class="bar-num"></span></div>
        <div class="d-row" data-d="C"><b>C</b><span class="bar"><span class="bar-fill bar-c"></span></span><span class="bar-num"></span></div>
        <div class="d-row" data-d="I"><b>I</b><span class="bar"><span class="bar-fill bar-i"></span></span><span class="bar-num"></span></div>
      </div>
      <div class="map-wrap">
        <canvas id="map" role="img" aria-label="Mapa del pueblo" tabindex="0"></canvas>
        <div class="float-right">
          <button id="zoom-in" class="fab" aria-label="Acercar">+</button>
          <button id="zoom-out" class="fab" aria-label="Alejar">−</button>
          <button id="whatnow" class="fab" aria-label="¿Qué hago ahora?">?</button>
          <button id="layers" class="fab fab-label" aria-label="Capas de datos: sin capa" aria-pressed="false"><span aria-hidden="true">▦</span><small>Capas</small></button>
        </div>
        <p id="tool-info" class="tool-info"></p>
        <span id="saved" class="saved" aria-live="off"></span>
        <div id="bubbles" class="bubbles"></div>
        <div id="legend" class="legend" role="status" hidden></div>
        <div id="objectives" class="objectives" aria-label="Objetivos"></div>
        <div id="confirm-bar" class="confirm-bar" role="group" aria-label="Confirmar obra" hidden>
          <p id="confirm-text" aria-live="polite"></p>
          <button id="confirm-no" class="btn" aria-label="Cancelar">✕</button>
          <button id="confirm-yes" class="btn primary">Construir</button>
        </div>
        <p id="ai-banner" class="ai-banner" role="status" hidden>IA en pausa: tope de gasto alcanzado. Deciden las reglas.</p>
      </div>
      <!-- v1.4: una sola barra abajo (antes eran dos): tiempo, herramientas y menú. -->
      <div id="dock" class="dock">
        <button id="play-pause" class="sp" aria-label="Poner en marcha">▶</button>
        <button id="speed" class="sp" aria-label="Velocidad x1. Toca para cambiarla">x1</button>
        <nav id="tools" class="tools" aria-label="Herramientas"></nav>
        <button id="menu" class="sp" aria-label="Menú">☰</button>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
