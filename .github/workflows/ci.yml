name: CI

on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, tipos, tests, invariantes y Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Invariantes de la simulación (365 días, varias semillas)
        run: pnpm invariants
      - name: IA con respuestas grabadas (ReplayProvider, sin red)
        run: pnpm ai-eval --replay e2e/fixtures/ia-replay.json --days 180 --seeds 2 --out ai-report.json
      - name: Informe del CLI
        run: pnpm sim --seed 42 --days 365 --profile casual --out report.json
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-y-capturas
          path: |
            test-results/
            playwright-report/
            report.json
            ai-report.json
          retention-days: 14

  image:
    name: Imagen Docker
    needs: check
    runs-on: ubuntu-latest
    permissions:
      # contents: write solo para crear la release de una versión nueva.
      contents: write
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v4
      # Publicado automático: al fusionar en main con una versión de package.json que aún no
      # tiene etiqueta, esta misma ejecución publica :X.Y.Z y :latest y crea la release.
      # (Una release creada con GITHUB_TOKEN no lanza otro workflow: no hay doble build.)
      - id: release
        name: ¿Versión nueva en package.json?
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-check.sh
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bitopolis
          flavor: latest=false
          tags: |
            type=raw,value=test,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.new == 'true' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || steps.release.outputs.new == 'true' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          # En ramas solo se comprueba que la imagen compila (amd64, sin publicar).
          platforms: ${{ env.PUBLISH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.release.outputs.new == 'true' && steps.release.outputs.version || github.ref_name }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Crear la release de la versión nueva
        if: steps.release.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.release.outputs.version }}" --target "$GITHUB_SHA" --title "Bitópolis ${{ steps.release.outputs.version }}" --generate-notes
