# Bitópolis — copia esto en Portainer (Stacks) o ejecuta: docker compose up -d
services:
  bitopolis:
    image: ghcr.io/kikope97/bitopolis:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - bitopolis-data:/data
    environment:
      # Obligatorias
      BITOPOLIS_MASTER_KEY: "cambia-esto-por-una-clave-larga-y-aleatoria" # cifra las API keys; si se pierde, se pierden las keys
      BITOPOLIS_PUBLIC_URL: "https://bitopolis.example.com"              # URL pública para generar los enlaces
      # Opcionales
      # PORT: "8080"
      # BITOPOLIS_USER: "familia"                 # con PASSWORD, pide usuario y contraseña a todo el servidor
      # BITOPOLIS_PASSWORD: "una-contraseña"
      # BITOPOLIS_API_KEY: "sk-..."               # key por defecto: todas las partidas en Modo IA
      # BITOPOLIS_AI_PROVIDER: "openai"           # openai | anthropic | gemini | deepseek | mistral | openrouter | openai-compatible
      # BITOPOLIS_AI_BASE_URL: "http://ollama:11434/v1"
      # BITOPOLIS_AI_MODEL: ""                    # modelo barato
      # BITOPOLIS_AI_MODEL_PREMIUM: ""            # modelo premium (si falta, el barato)
      # BITOPOLIS_AI_MAX_CITIZENS: "20"
      # BITOPOLIS_BUDGET_SERVER_MONTHLY_EUR: "10"
      # BITOPOLIS_BUDGET_GAME_MONTHLY_EUR: "5"
      # BITOPOLIS_BUDGET_GAME_DAILY_EUR: "0.5"
      # BITOPOLIS_AI_PRICES_JSON: '{"modelo": {"in": 0.15, "out": 0.6}}'

volumes:
  bitopolis-data:
