# Bitópolis — copia esto en Portainer (Stacks) o ejecuta: docker compose up -d
services:
  bitopolis:
    image: ghcr.io/kikope97/bitopolis:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - bitopolis-data:/data
    environment:
      # Obligatorias
      BITOPOLIS_MASTER_KEY: "cambia-esto-por-una-clave-larga-y-aleatoria" # cifra las API keys; si se pierde, se pierden las keys
      BITOPOLIS_PUBLIC_URL: "https://bitopolis.example.com"              # URL pública para generar los enlaces
      # Opcionales
      # PORT: "8080"
      # BITOPOLIS_PASSWORD: "una-contraseña"      # si la pones, el servidor pide esta contraseña (sin usuario) para entrar
      # --- IA (si no pones la key, cada partida la pone en Configurar) ---
      # BITOPOLIS_API_KEY: "sk-ant-..."           # Anthropic (sk-ant-…) u OpenAI (sk-…): el proveedor se deduce de la key
      # BITOPOLIS_AI_MODEL: ""                    # opcional; por defecto claude-haiku-5-5 (Anthropic) o gpt-5.4-nano (OpenAI)
      # BITOPOLIS_AI_MODEL_PREMIUM: ""            # opcional; por defecto claude-sonnet-5-5 o gpt-5.4-mini
      # BITOPOLIS_AI_BASE_URL: "http://ollama:11434/v1"  # solo para un modelo local compatible con OpenAI
      # BITOPOLIS_AI_MAX_CITIZENS: "20"
      # BITOPOLIS_BUDGET_SERVER_MONTHLY_EUR: "10"
      # BITOPOLIS_BUDGET_GAME_MONTHLY_EUR: "5"
      # BITOPOLIS_BUDGET_GAME_DAILY_EUR: "0.5"
      # BITOPOLIS_AI_PRICES_JSON: '{"modelo": {"in": 0.15, "out": 0.6}}'

volumes:
  bitopolis-data:
