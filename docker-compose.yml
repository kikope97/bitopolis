# Bitópolis — copia esto en Portainer (Stacks) o ejecuta: docker compose up -d
# No hay variables que rellenar: todo se configura en http://tu-servidor:8080/admin
# (la primera vez, usuario «admin» y contraseña «admin»; el panel obliga a cambiarla).
services:
  bitopolis:
    image: ghcr.io/kikope97/bitopolis:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - bitopolis-data:/data   # partidas, ajustes, copias y la clave que cifra las API keys

volumes:
  bitopolis-data:
